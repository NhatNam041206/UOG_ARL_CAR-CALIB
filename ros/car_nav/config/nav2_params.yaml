# Nav2 for the NAV2 mode, shared by the simulator and the real car.
#
# Car facts behind these numbers (see car.yaml; tests/test_car_nav_nav2_params.py
# checks they stay consistent):
# * base_link = front (fixed) axle centre, the car steers with its REAR
#   wheels. The front axle cannot slip sideways, so base_link moves like a
#   differential-drive point that cannot turn in place: AMCL's differential
#   motion model and pure pursuit at base_link are both exact.
# * Forward only, ONE speed: drive_code is STOP/FORWARD, no speed value.
#   Speed regulation in RPP is therefore off; desired_linear_vel = the
#   baseline speed (0.5 m/s, unmeasured).
# * Command latency ~0.65 s: the car drives ~0.33 m before a new command
#   acts. Lookahead 0.9 m keeps tracking stable with that delay (pure-python
#   check in tests: <0.12 m cross-track on 0.75 m radius turns); the
#   collision monitor stops when the path ahead is blocked within ~0.54 m.
# * Weak side = right (~27 deg servo): min turning radius ~0.55 m with the
#   placeholder curvature table; the planner uses 0.75 m for margin.
# * All scan consumers read /scan_nav (frame laser_upright), never the raw
#   upside-down /scan, because rf2o only uses the laser's yaw.
#
# use_sim_time, map yaml and BT xml paths are filled in by nav.launch.py.

amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan_nav
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.5
    alpha2: 0.5
    alpha3: 0.5
    alpha4: 0.5
    alpha5: 0.2
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.15
    laser_model_type: "likelihood_field"
    max_beams: 720   # every beam of the sim scan (0.5 deg); a corridor end wall (1.2 m at 6 m) gets ~23 beams
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true   # nav.launch sets false when pose_gate (default) publishes map -> odom
    transform_tolerance: 1.0
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.9
    z_max: 0.05
    z_rand: 0.1      # 0.5 let ~116 "any position fits" side-wall beams drown the end wall
    z_short: 0.05
    set_initial_pose: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 10
    # ms the BT waits for a server (planner/controller) to ACCEPT a goal.
    # Nav2's 20 ms default is too short on slower machines: on nam's laptop
    # (Docker Desktop/WSL, 2026-11-11) follow_path timed out acknowledging,
    # the BT counted it as a failure and gave up goals mid-route. The Pi 5
    # running the whole stack is no faster, so give it room.
    default_server_timeout: 500
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    default_nav_to_pose_bt_xml: ""
    error_code_names: ["compute_path_error_code", "follow_path_error_code"]
    transform_tolerance: 0.5

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    enable_stamped_cmd_vel: false
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      # The car cannot slow down and keeps going ~0.35 m after STOP
      # (latency + braking): a tight tolerance would make it drive past
      # the goal and circle back. Final error is reported by the sim.
      xy_goal_tolerance: 0.5
      # Position-only goals. A forward-only car can only fix its heading by
      # driving on, so a yaw tolerance made it circle the goal (sim, CI run
      # 2026-11-10: 43 m driven for one goal). The planned path already
      # ends on the goal heading; the report shows the final heading error.
      yaw_goal_tolerance: 3.14
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      lookahead_dist: 1.1
      min_lookahead_dist: 0.9
      max_lookahead_dist: 1.4
      lookahead_time: 1.8
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.5
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 0.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      # Keep the curvature carrot 0.9 m ahead even at the end of the path
      # (extended along the goal heading). Without it the carrot collapses
      # onto the goal, curvature spikes in the last metre, and the 0.65 s
      # of coasting after STOP swings the car up to ~35 deg off heading.
      use_fixed_curvature_lookahead: true
      curvature_lookahead_dist: 1.1
      use_rotate_to_heading: false
      rotate_to_heading_angular_vel: 1.0
      rotate_to_heading_min_angle: 3.14
      allow_reversing: false
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0
      interpolate_curvature_after_goal: true
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # x_front 0.16, x_rear -0.37, half_width 0.135 (car.yaml footprint)
      footprint: "[[0.16, 0.135], [0.16, -0.135], [-0.37, -0.135], [-0.37, 0.135]]"
      footprint_padding: 0.02
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_nav
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.5
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[0.16, 0.135], [0.16, -0.135], [-0.37, -0.135], [-0.37, 0.135]]"
      footprint_padding: 0.02
      resolution: 0.05
      track_unknown_space: true
      # Static map only (nam 2026-11-15): with a pose that lags 0.6-1 m in
      # blind corridors, scans marked at the wrong place left phantom
      # obstacles that closed the 1.2 m corridor ("no valid path found",
      # sim 2026-11-14). Live obstacles are handled by the local costmap,
      # the collision monitor and the PD follower's wall avoidance. To plan
      # around live obstacles again, add "obstacle_layer" back to plugins.
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:       # not in plugins (see above), kept for switching back
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_nav
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.6
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      # Forward only: DUBIN has no reverse primitives (REEDS_SHEPP would).
      motion_model_for_search: "DUBIN"
      minimum_turning_radius: 0.75
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.25
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      debug_visualizations: false
      use_quadratic_cost_penalty: false
      downsample_obstacle_heuristic: true
      allow_primitive_interpolation: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # No spin / backup / drive_on_heading: forward-only car.
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    enable_stamped_cmd_vel: false

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_nav
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.5
    source_timeout: 1.0
    base_shift_correction: false  # true needs odom TF at the scan time + now; adaptive_odom lagging 10 ms made "invalid source" stops (sim 2026-11-14)
    stop_pub_timeout: 2.0
    enable_stamped_cmd_vel: false
    # The car has ONE speed, so slowdown cannot happen. Two zones:
    # * FootprintApproach follows the CURRENT curvature, so it does not
    #   fire on walls a turn will miss (a straight box ahead did: CI sim
    #   2026-11-10, the car froze before a turn next to a pillar). It
    #   scales v to d / time_before_collision; cmd_vel_to_control sends
    #   STOP below forward_threshold_mps (0.3), so the car stops when the
    #   predicted path hits something within 0.3 x 1.8 = 0.54 m
    #   (= 0.33 m latency travel + ~0.06 m braking + 0.15 m margin).
    # * PolygonStop is the bumper zone, the backstop when the approach
    #   zone's prediction is wrong (it follows the COMMANDED curvature, but
    #   the wheels follow it ~0.65 s later). It must reach as far ahead of
    #   the nose as the car travels before a STOP acts: one scan period
    #   (0.07 m) + latency (0.33 m) + braking (0.06 m) = 0.46 m, so the
    #   front edge is x_front 0.16 + 0.46 + 0.02 = 0.64 m. It is only a
    #   little wider than the car (0.15 vs 0.135) so walls and pillars
    #   beside the path do not trigger it. The earlier 0.30 m bumper ended
    #   0.14 m past the nose: CI sim 2026-11-11 (loop_left rf2o) it fired
    #   and the car still hit the shelf.
    polygons: ["PolygonStop", "FootprintApproach"]
    PolygonStop:
      type: polygon
      points: "[[0.64, 0.15], [0.64, -0.15], [0.0, -0.15], [0.0, 0.15]]"
      action_type: stop
      min_points: 3
      visualize: true
      polygon_pub_topic: polygon_stop
      enabled: true
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.8
      simulation_time_step: 0.05
      min_points: 3
      visualize: false
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: scan
      topic: /scan_nav
      min_height: 0.05
      max_height: 2.0
      enabled: true

rf2o_laser_odometry:
  ros__parameters:
    use_sim_time: false
    laser_scan_topic: /scan_odom  # /scan_nav with inf -> 0 (see scan_upright.py)
    odom_topic: /odom
    publish_tf: true
    base_frame_id: base_link
    odom_frame_id: odom
    init_pose_from_topic: ""
    freq: 10.0

adaptive_odom:
  # odom_source:=adaptive (car_nav/adaptive_odom.py + speed_filter.py):
  # forward motion = w*rf2o + (1-w)*learned speed, w = how many scan points
  # face the driving direction (obs_points_low..high). The start speed and
  # command latency come from car.yaml (speed.*); the speed is then learned.
  ros__parameters:
    use_sim_time: false
    accel_mps2: 1.0
    decel_mps2: 2.0
    speed_random_walk: 0.01       # how fast the real speed may drift (m/s per sqrt(s))
    rf2o_speed_noise: 0.08        # m/s, rf2o forward speed where it sees well
    obs_points_low: 10            # <= this many facing points: rf2o cannot see forward motion
    obs_points_high: 50           # >= this many: trust rf2o fully
    obs_max_range_m: 8.0
    correction_min_blind_m: 1.0   # AMCL correction -> speed after >= this many blind metres
    correction_min_along_m: 0.3
    correction_max_blind_m: 6.0

pose_gate:
  # car_nav/pose_gate.py + localization_gate.py: map -> odom from AMCL, but
  # AMCL's correction ALONG the heading is only taken in proportion to the
  # scan observability (adaptive_odom /scan_observability): in a blind
  # corridor AMCL's particles wander along it (2026-11-12: AMCL 4.2 m off,
  # odometry alone 1.35 m). Sideways and heading corrections are always taken.
  ros__parameters:
    use_sim_time: false
    obs_full: 0.5                 # observability at which the along correction is taken fully
    publish_rate_hz: 10.0         # also sent on every AMCL update; 20 Hz doubled /tf traffic for every TF listener (sim 2026-11-17)
    transform_tolerance: 0.5
    observability_timeout_s: 2.0  # no observability (odom_source rf2o): pass AMCL through
    reseed_enabled: true          # put AMCL back on the gated pose when its cloud wanders
    reseed_along_m: 0.3
    reseed_min_interval_s: 2.0
    reseed_sigma_along_m: 0.15
    reseed_sigma_lateral_m: 0.08
    reseed_sigma_yaw_rad: 0.05

pd_path_follower:
  # PD path follower (car_nav/pd_follower.py), used with controller:=pd
  # (default). kappa = ff*path_curvature - kp*offset - kd*sin(heading error).
  # kp: how hard it pulls back to the path (1/m^2); kd: damping (1/m), the D
  # term (heading error = rate of change of the offset along the path).
  # Chosen in a pure-Python model with 0.65 s delay and AMCL-like noise
  # (3 cm, 2 deg): kp 0.7 / kd 1.2 gives ~4 cm max offset and ~1/2 the
  # steering reversals of Pure Pursuit 1.1 m. Higher kd reacts to heading
  # noise and with the delay starts to rock; lower kp leaves more offset in
  # turns when the car understeers.
  ros__parameters:
    use_sim_time: false
    kp: 0.7
    kd: 1.2
    ff: 1.0
    ff_ahead_m: 0.3          # 0.65 cuts corners ~20 cm with a true pose (test_car_nav_pd_follower)
    speed_mps: 0.5           # = car.yaml speed baseline (RPP desired_linear_vel)
    rate_hz: 10.0
    xy_goal_tolerance: 0.5   # = general_goal_checker
    progress_radius_m: 0.3   # = progress_checker
    progress_time_s: 10.0
    global_frame: map
    robot_frame: base_link
    max_pose_age_s: 1.0      # stop while the pose is older (lagging odometry); 7 Hz LiDAR + rf2o on a
                             # busy laptop reached 0.5-1.0 s now and then, 0.5 stopped the car often
                             # (nav.launch arg max_pose_age_s overrides it; the sim uses 1.5)
    # LiDAR wall avoidance (car_nav/wall_avoid.py), arc check like DWA
    # (nam 2026-11-15): the footprint (rear swing included) is swept along
    # the PD's arc on the latest scan. Clear for avoid_horizon_m -> the PD
    # drives, however close a wall is (inner corners of planned turns).
    # Hits -> the clear candidate arc (full right .. full left, from the
    # steering table) closest to the PD's is driven until the PD's arc is
    # clear for release_factor x horizon. Needs no pose.
    avoid_enabled: true
    avoid_margin_m: 0.05
    avoid_horizon_m: 1.3          # 0.33 m driven in the 0.65 s delay + 1 m; 1.0 saved a 0.8 m pose lag too late (test)
    avoid_release_factor: 1.3
    avoid_candidates: 13
    avoid_max_scan_age_s: 0.5

cmd_vel_to_control:
  ros__parameters:
    use_sim_time: false
    rate_hz: 10.0
    watchdog_s: 0.5
    # RPP always asks for 0.5 m/s (no regulation); anything the collision
    # monitor scales below 0.3 becomes STOP (see collision_monitor above).
    forward_threshold_mps: 0.3
