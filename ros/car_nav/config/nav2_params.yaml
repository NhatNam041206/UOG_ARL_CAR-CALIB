# Nav2 for the NAV2 mode, shared by the simulator and the real car.
#
# SKID-STEER car (differential drive). Car facts behind these numbers (see
# car.yaml; tests/test_car_nav_nav2_params.py checks they stay consistent):
# * base_link = centre of the car, midway between the left and right wheels.
#   It turns on the spot: AMCL's differential motion model is exact, the
#   planner is a plain 2D grid planner (no turning radius), and the PD
#   follower / RPP turn on the spot when the path heads away from the car.
# * Variable speed: the wheel command is "<left m/s>,<right m/s>", so Nav2
#   can slow down (curves, goal, collision monitor approach zone).
#   Cruise 0.4 m/s, wheels <= 0.6 m/s, yaw <= 1.5 rad/s (car.yaml drive.*).
# * Forward only (drive.allow_reverse false): no BackUp, Spin is allowed.
# * Command latency assumed 0.25 s (unmeasured): 0.1 m at cruise speed.
# * Skid-steer turns slower than (right - left) / track says (wheels slide):
#   rf2o measures the real rotation, the PD loop corrects the rest.
# * LiDAR mounted upright: scan_upright passes /scan_filtered through to
#   /scan_nav (and /scan_odom with inf -> 0 for rf2o).
#
# use_sim_time, map yaml and BT xml paths are filled in by nav.launch.py.

amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan_nav
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.5
    alpha2: 0.5
    alpha3: 0.5
    alpha4: 0.5
    alpha5: 0.2
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.15
    laser_model_type: "likelihood_field"
    max_beams: 720   # every beam of the sim scan (0.5 deg); a corridor end wall (1.2 m at 6 m) gets ~23 beams
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true   # nav.launch sets false when pose_gate (default) publishes map -> odom
    transform_tolerance: 1.0
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.9
    z_max: 0.05
    z_rand: 0.1      # 0.5 let ~116 "any position fits" side-wall beams drown the end wall
    z_short: 0.05
    set_initial_pose: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 10
    # ms the BT waits for a server (planner/controller) to ACCEPT a goal.
    # Nav2's 20 ms default is too short on slower machines: on nam's laptop
    # (Docker Desktop/WSL, 2026-11-11) follow_path timed out acknowledging,
    # the BT counted it as a failure and gave up goals mid-route. The Pi 5
    # running the whole stack is no faster, so give it room.
    default_server_timeout: 500
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    default_nav_to_pose_bt_xml: ""
    error_code_names: ["compute_path_error_code", "follow_path_error_code"]
    transform_tolerance: 0.5

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    enable_stamped_cmd_vel: false
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      # The skid-steer car slows down near the goal and stops within a few
      # cm (latency 0.25 s at the slow approach speed), and it can turn on
      # the spot to the goal heading.
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.4
      lookahead_dist: 0.6
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.0
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.5
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.15
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      # skid-steer: turn on the spot toward the path / goal heading
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 1.2
      rotate_to_heading_min_angle: 0.9
      allow_reversing: false
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0
      interpolate_curvature_after_goal: false
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # x_front 0.185, x_rear -0.185, half_width 0.135 (car.yaml footprint)
      footprint: "[[0.185, 0.135], [0.185, -0.135], [-0.185, -0.135], [-0.185, 0.135]]"
      footprint_padding: 0.02
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_nav
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.5
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[0.185, 0.135], [0.185, -0.135], [-0.185, -0.135], [-0.185, 0.135]]"
      footprint_padding: 0.02
      resolution: 0.05
      track_unknown_space: true
      # Static map only (nam 2026-11-15): with a pose that lags 0.6-1 m in
      # blind corridors, scans marked at the wrong place left phantom
      # obstacles that closed the 1.2 m corridor ("no valid path found",
      # sim 2026-11-14). Live obstacles are handled by the local costmap,
      # the collision monitor and the PD follower's wall avoidance. To plan
      # around live obstacles again, add "obstacle_layer" back to plugins.
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:       # not in plugins (see above), kept for switching back
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_nav
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Slow decay over the whole 1.2 m corridor so Smac 2D keeps to its
        # middle (4.0 / 0.6 let the path run 0.3 m from a wall: campus sim
        # 2026-11-17, the car then could not turn on the spot at the goal).
        cost_scaling_factor: 2.0
        inflation_radius: 0.8
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      # Skid-steer: no turning radius, so a 2D grid A* (the car turns on the
      # spot at sharp corners and at the start). cost_travel_multiplier keeps
      # the path in the middle of corridors.
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 4.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # Spin (recovery: turn on the spot) and wait; no backup (forward only).
    behavior_plugins: ["spin", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    wait:
      plugin: "nav2_behaviors::Wait"
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.5
    rotational_acc_lim: 3.2
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    enable_stamped_cmd_vel: false

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_nav
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.5
    source_timeout: 1.0
    base_shift_correction: false  # true needs odom TF at the scan time + now; adaptive_odom lagging 10 ms made "invalid source" stops (sim 2026-11-14)
    stop_pub_timeout: 2.0
    enable_stamped_cmd_vel: false
    # Two zones:
    # * VelocityStop, the bumper: its shape depends on what the car is doing.
    #   Driving forward it reaches 0.22 m past the nose (x 0.405): one scan
    #   period 0.06 m + latency 0.25 s x 0.4 m/s = 0.10 m + braking 0.04 m
    #   + 0.02. It is only a little wider than the car (0.15 vs 0.135) so
    #   walls beside the path do not trigger it. Turning on the spot it is
    #   the footprint + 3 cm: a box ahead would block the turn that gets the
    #   car away from a wall.
    # * FootprintApproach follows the current (v, omega): the speed is scaled
    #   down so the footprint never reaches an obstacle within
    #   time_before_collision; unlike the old one-speed car this really slows
    #   the car down.
    # Safety guard for PEOPLE (nam 2026-11-17): /scan_dynamic holds only scan
    # points that are not on the map (car_nav/dynamic_scan.py), so these
    # zones can reach further than the wall bumper without stopping the car
    # at every corner:
    # * PersonStop: someone within the danger range -> stop, drive on when
    #   they have left it. Driving: 0.6 m past the nose (x 0.785), +-0.35 m;
    #   turning on the spot: anyone within 0.25 m of the body.
    # * PersonSlow: someone within 1.5 m ahead, +-0.5 m -> 40 % speed.
    polygons: ["PersonStop", "PersonSlow", "VelocityStop", "FootprintApproach"]
    PersonStop:
      type: velocity_polygon
      action_type: stop
      min_points: 3
      visualize: true
      polygon_pub_topic: polygon_person_stop
      enabled: true
      holonomic: false
      sources_names: ["dynamic"]
      velocity_polygons: ["rotation", "forward"]
      rotation:
        points: "[[0.435, 0.385], [0.435, -0.385], [-0.435, -0.385], [-0.435, 0.385]]"
        linear_min: -0.05
        linear_max: 0.05
        theta_min: -3.0
        theta_max: 3.0
      forward:
        points: "[[0.785, 0.35], [0.785, -0.35], [0.0, -0.35], [0.0, 0.35]]"
        linear_min: 0.05
        linear_max: 2.0
        theta_min: -3.0
        theta_max: 3.0
    PersonSlow:
      type: polygon
      action_type: slowdown
      slowdown_ratio: 0.4
      points: "[[1.685, 0.5], [1.685, -0.5], [0.0, -0.5], [0.0, 0.5]]"
      min_points: 3
      visualize: false
      enabled: true
      sources_names: ["dynamic"]
    VelocityStop:
      type: velocity_polygon
      action_type: stop
      min_points: 3
      sources_names: ["scan"]
      visualize: true
      polygon_pub_topic: polygon_stop
      enabled: true
      holonomic: false
      velocity_polygons: ["rotation", "forward"]
      rotation:
        points: "[[0.215, 0.165], [0.215, -0.165], [-0.215, -0.165], [-0.215, 0.165]]"
        linear_min: -0.05
        linear_max: 0.05
        theta_min: -3.0
        theta_max: 3.0
      forward:
        points: "[[0.405, 0.15], [0.405, -0.15], [0.0, -0.15], [0.0, 0.15]]"
        linear_min: 0.05
        linear_max: 2.0
        theta_min: -3.0
        theta_max: 3.0
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.2
      simulation_time_step: 0.05
      min_points: 3
      sources_names: ["scan"]
      visualize: false
      enabled: true
    observation_sources: ["scan", "dynamic"]
    scan:
      type: scan
      topic: /scan_nav
      min_height: 0.05
      max_height: 2.0
      enabled: true
    dynamic:
      type: scan
      topic: /scan_dynamic
      min_height: 0.05
      max_height: 2.0
      enabled: true

dynamic_scan:
  # car_nav/dynamic_scan.py: /scan_nav -> /scan_dynamic (points not on the map)
  ros__parameters:
    use_sim_time: false
    tol_m: 0.35         # a point this close to a map wall is the wall (covers pose error; 0.3 saw walls as people)
    max_range_m: 2.0    # zones reach 1.7 m; a 5 deg heading error moves a 2 m point 0.17 m
    max_tf_age_s: 0.5   # no pose this fresh -> fallback
    fallback: "all"     # no map or no pose: every beam counts (safe; may stop near walls)

rf2o_laser_odometry:
  ros__parameters:
    use_sim_time: false
    laser_scan_topic: /scan_odom  # /scan_nav with inf -> 0 (see scan_upright.py)
    odom_topic: /odom
    publish_tf: true
    base_frame_id: base_link
    odom_frame_id: odom
    init_pose_from_topic: ""
    freq: 10.0

adaptive_odom:
  # odom_source:=adaptive (car_nav/adaptive_odom.py + speed_filter.py):
  # forward motion = w*rf2o + (1-w)*(commanded speed x learned ratio),
  # w = how many scan points face the driving direction (obs_points_low..high).
  # Command latency from car.yaml (speed.command_latency_s, 0.25 while null).
  # wheel_odom_topic: the car's encoder odometry, when it has one, replaces
  # the commanded speed (the ratio then absorbs wheel slip).
  ros__parameters:
    use_sim_time: false
    accel_mps2: 1.0
    decel_mps2: 2.0
    speed_random_walk: 0.01       # how fast the real speed may drift (m/s per sqrt(s))
    rf2o_speed_noise: 0.08        # m/s, rf2o forward speed where it sees well
    obs_points_low: 10            # <= this many facing points: rf2o cannot see forward motion
    obs_points_high: 50           # >= this many: trust rf2o fully
    obs_max_range_m: 8.0
    correction_min_blind_m: 1.0   # AMCL correction -> speed after >= this many blind metres
    correction_min_along_m: 0.3
    correction_max_blind_m: 6.0
    wheel_odom_topic: ""

pose_gate:
  # car_nav/pose_gate.py + localization_gate.py: map -> odom from AMCL, but
  # AMCL's correction ALONG the heading is only taken in proportion to the
  # scan observability (adaptive_odom /scan_observability): in a blind
  # corridor AMCL's particles wander along it (2026-11-12: AMCL 4.2 m off,
  # odometry alone 1.35 m). Sideways and heading corrections are always taken.
  ros__parameters:
    use_sim_time: false
    obs_full: 0.5                 # observability at which the along correction is taken fully
    publish_rate_hz: 20.0
    transform_tolerance: 0.5
    observability_timeout_s: 2.0  # no observability (odom_source rf2o): pass AMCL through
    reseed_enabled: true          # put AMCL back on the gated pose when its cloud wanders
    reseed_along_m: 0.3
    reseed_min_interval_s: 2.0
    reseed_sigma_along_m: 0.15
    reseed_sigma_lateral_m: 0.08
    reseed_sigma_yaw_rad: 0.05
    # Startup race (sim 2026-11-17, 8 of 32 runs): an /initialpose that reached the gate
    # after AMCL's answer left map -> odom unpublished; the car never started and AMCL,
    # which only updates while the car moves, never answered again. The gate resends the
    # last initial pose every initialpose_retry_s until an AMCL pose arrives after it.
    initialpose_retry_s: 2.0      # 0 = off
    initialpose_retry_max: 10
    # Skid-steer: while the car turns on the spot (odometry |omega| > 0.3 rad/s,
    # |v| < 0.08 m/s) and 1 s after, only AMCL's heading is taken: AMCL slid
    # 1.2 m along a corridor during one turn (campus sim 2026-11-17).
    spin_hold_rate_rps: 0.3
    spin_hold_speed_mps: 0.08
    spin_hold_after_s: 1.0

pd_path_follower:
  # PD path follower (car_nav/pd_follower.py), used with controller:=pd
  # (default). kappa = ff*path_curvature - kp*offset - kd*sin(heading error),
  # then diff_drive_command(): v = speed_mps (lower in tight curves so the
  # yaw stays <= max_yaw_rate_rps, and over the last goal_slow_m), omega =
  # v*kappa; above rotate_enter_deg heading error it turns on the spot
  # until below rotate_exit_deg. At the goal it turns on the spot to the
  # goal heading (yaw_goal_tolerance; >= 3.14 = position only).
  # kp (1/m^2) / kd (1/m) act along the path, independent of speed; with the
  # 0.25 s latency (0.1 m at cruise) the car tolerates more kp than the old
  # rear-steer car with its 0.65 s.
  ros__parameters:
    use_sim_time: false
    kp: 1.5
    kd: 2.0
    ff: 1.0
    ff_ahead_m: 0.1          # = distance driven in the 0.25 s latency; 1 m-radius corner ~1 cm off (test_car_nav_pd_follower)
    speed_mps: 0.4           # = car.yaml drive.cruise_speed_mps
    min_speed_mps: 0.08
    max_yaw_rate_rps: 1.5    # = car.yaml drive.max_yaw_rate_rps
    rotate_enter_deg: 52.0
    rotate_exit_deg: 14.0
    rotate_gain: 2.0
    min_rotate_rps: 0.8      # skid-steer wheels stick below a minimum turn rate (0.5 stalled at 0.04 m/s wheels)
    goal_slow_m: 0.6
    # Slow down BEFORE curves: v <= sqrt(lat_accel / max path curvature in the
    # next curve_preview_m). Smac 2D corners are tight (1/kappa ~0.4 m); at
    # 0.4 m/s the car reached a campus corner too fast and touched the wall.
    lat_accel_mps2: 0.25
    curve_preview_m: 0.8
    rate_hz: 10.0
    xy_goal_tolerance: 0.2   # = general_goal_checker
    yaw_goal_tolerance: 0.25
    progress_radius_m: 0.3   # = progress_checker
    progress_time_s: 10.0
    global_frame: map
    robot_frame: base_link
    max_pose_age_s: 1.0      # stop while the pose is older (lagging odometry)
                             # (nav.launch arg max_pose_age_s overrides it; the sim uses 1.5)
    # LiDAR wall avoidance (car_nav/wall_avoid.py), arc check like DWA: the
    # footprint is swept along the PD's arc on the latest scan. Clear for
    # avoid_horizon_m -> the PD drives. Hits -> the clear candidate arc
    # (-avoid_max_curvature .. +avoid_max_curvature) closest to the PD's is
    # driven until the PD's arc is clear for release_factor x horizon.
    # Not used while turning on the spot. Needs no pose.
    avoid_enabled: true
    avoid_margin_m: 0.05
    avoid_horizon_m: 0.9          # 0.1 m driven in the 0.25 s delay + 0.8 m
    avoid_release_factor: 1.3
    avoid_candidates: 13
    avoid_max_curvature: 2.5      # 1/m (0.4 m radius); the car could turn tighter
    avoid_max_scan_age_s: 0.5

cmd_vel_to_control:
  ros__parameters:
    use_sim_time: false
    rate_hz: 10.0
    watchdog_s: 0.5
    # Wheel speeds are capped by car.yaml drive.max_wheel_speed_mps (both
    # wheels scaled together, curvature kept).
