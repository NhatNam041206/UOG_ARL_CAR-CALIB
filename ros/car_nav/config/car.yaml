# Car geometry for NAV2 mode (ros-nav container), SKID-STEER car.
#
# base_link = the floor point at the CENTRE of the car, midway between the
# left and right wheels (and between the front and rear axles): the point a
# skid-steer (differential drive) car turns about. It can turn on the spot.
# Axes (REP-103): x forward, y left, z up. Metres, radians unless *_deg.
#
# A value of null means "not measured yet". The launch file warns loudly
# and uses 0 (or the assumed_* value) for it. Measure it and replace null.

footprint:
  # Body 0.70 m long x 0.60 m wide (owner's measurement, 2026-11-19; the
  # earlier 0.37 x 0.27 m was an assumption), centred on base_link.
  # Turning on the spot the corners sweep a circle of radius
  # sqrt(0.35^2 + 0.30^2) = 0.46 m: that, not the width, is the room the
  # car needs to turn (pd_follower.spin_clear_radius_m uses it).
  x_front: 0.35
  x_rear: -0.35
  half_width: 0.30

laser:
  # RPLIDAR A1, mounted the normal way up (motor down, scan plane level):
  # roll = pitch = 0, the driver's `inverted` stays false.
  x: 0.0           # ASSUMED at the car centre (owner did not give it; measure it)
  y: 0.0
  z: 0.24          # height above the floor (m), owner's measurement 2026-11-19
                   # (was 0.42). Only obstacles taller than this are in the scan.
  roll: 0.0
  pitch: 0.0
  yaw: null        # direction of the A1's 0 deg mark once mounted (rad)
  max_range_m: 12.0

self_mask:
  # Scan points inside the footprint (+ margin) are the car itself.
  # Kept at 0.03: anything farther than 0.33 m from the centre line is real.
  # A bigger margin would hide a wall scraping the side of the car (0.30 m
  # from the centre). The LiDAR x is only assumed (0): if scan_self_mask logs
  # masked bearings at the front/rear after measuring laser.x, fix laser.x
  # rather than widening this.
  margin_m: 0.03
  # Extra sectors to drop, in base_link bearing degrees (0 = ahead,
  # +90 = left), e.g. a mast leg outside the footprint: [[150, 170]].
  sectors_deg: []

camera:
  # Orbbec Astra Pro at the car centre (x = y = 0), 1.20 m high (owner's
  # measurement 2026-11-19; was 1.035). Pitch ASSUMED unchanged: about 15 deg
  # down (positive pitch = nose down in REP-103); measure it.
  x: 0.0
  y: 0.0
  z: 1.20
  roll: 0.0
  pitch_deg: 15.0
  yaw: 0.0

speed:
  # Commanded speed -> real speed. adaptive_odom learns the ratio online
  # (rf2o where the scan sees forward motion, AMCL corrections elsewhere).
  command_latency_s: null    # wheel command sent -> wheels react (s); 0.25 assumed
  measured: false

drive:
  # Skid-steer / differential drive. Wheel command "<left m/s>,<right m/s>"
  # on /car/wheels/cmd (car_nav/actuation.py), turned into the car's own
  # command format by the ugv-controller adapter.
  type: diff_drive
  track_width_m: null          # left wheel centre -> right wheel centre (m)
  assumed_track_width_m: 0.52  # ASSUMED (wheel centre to wheel centre, body 0.60 wide); used while track_width_m is null
  wheel_radius_m: null         # only for the adapter (m/s <-> rad/s or rpm)
  max_wheel_speed_mps: 0.6     # never command a wheel faster than this
  cruise_speed_mps: 0.4        # Nav2 driving speed (pd_path_follower.speed_mps)
  max_yaw_rate_rps: 1.5        # fastest turn Nav2 asks for
  min_wheel_speed_mps: 0.0     # motor dead band: both wheels below -> 0,0
  # Turning on the spot slower than this does not turn the car (wheels stick,
  # sim.yaml truth.min_spin_wheel_mps 0.05): a slow spin (collision monitor
  # slowdown) is sent at this wheel speed. Measure: smallest "-n n" that turns it.
  min_spin_wheel_mps: 0.08
  # NAV2 drives forward and turns on the spot; reversing stays off until the
  # rear is checked by a sensor (the LiDAR sees it, but nothing is tuned for it).
  allow_reverse: false

ugv:
  # Motor controller: ugv-controller (ESP32-C3, USB serial, "<left> <right>"
  # integers -500..500 = ESC pulse 1500 +- us). car_nav/ugv_link.py.
  # Open loop, so m/s -> units must be measured: drive "100 100" for 5 s on
  # the floor, measure the distance d (m): units_per_mps = 100 / (d / 5).
  units_per_mps: null
  assumed_units_per_mps: 250   # 0.4 m/s cruise -> "100 100" (the guide's start speed)
  deadband_units: 0            # ESC dead band: smallest |units| that turns a wheel
  max_units: 200               # never send more (safety cap; 0.6 m/s wheel limit = 150)
  invert_left: false           # a side that drives backwards on "100 100"
  invert_right: false
  swap_sides: false            # "100 0" turns the car LEFT -> sides are swapped
