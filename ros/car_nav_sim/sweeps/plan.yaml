# Run by hand: Actions -> nav2 sim sweep -> Run workflow (.github/workflows/nav-sim-sweep.yml):
# every variant x stress x mission x odometry, `repeats` times with different LiDAR
# noise seeds, then one table of pass rates in the job log.
# variants = nav2_params overrides (files in this folder),
# stress   = what the simulated car really does (sim.yaml overrides, stress/ folder).
#
# Round 1 (2026-11-11, nominal car, 6 repeats, rf2o): all variants 11-12/12;
# min clearance baseline 0.08-0.14 m, lookahead11 0.34-0.37 m.
# Round 2 (hard car: latency 0.9 s, 0.6 m/s, understeer 0.85; 6 repeats, rf2o):
#   old baseline  loop_right 0/6 (loop_left timed out)
#   lookahead11   loop_left 0/6, loop_right 1/6
#   combo         loop_left 5/6, loop_right 6/6   -> combo is now the default
#   (nav2_params.yaml), so `baseline` below = combo.
# Round 3 (new default): nominal 12/12 (min clearance 0.33 m),
#   hard 7/12 (loop_left 3/6 with 4 collisions, loop_right 4/6).
#   Same params as round-2 combo (11/12), so 6 repeats are too few to rank.
# Round 4 (hard car only, 12 repeats): loop_left 6/12 (every failure at goal 3,
#   with a collision), loop_right 7/12 -> 13/24.
variants: [baseline]
stress: [hard]
missions: [loop_left, loop_right]
odom: [rf2o]
repeats: 12
