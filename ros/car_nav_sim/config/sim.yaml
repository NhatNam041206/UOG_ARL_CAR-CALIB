# What the SIMULATED skid-steer car really does (the "truth"). Nav2 does
# not read this file: it only knows car.yaml. Make this car worse than
# car.yaml says to see how much margin NAV2 has (e.g. yaw_efficiency 0.6,
# latency_s 0.5, speed_scale 0.8, right_gain 0.9).
truth:
  latency_s: 0.25          # wheel command sent -> wheels react (unmeasured; car.yaml assumes 0.25)
  max_wheel_speed_mps: 0.7 # the motors' own limit (car.yaml lets Nav2 use 0.6)
  accel_mps2: 1.5
  decel_mps2: 2.5
  speed_scale: 1.0         # real forward speed / commanded
  left_gain: 1.0           # one side weaker than the other
  right_gain: 1.0
  yaw_efficiency: 0.8      # skid-steer: real omega / (right - left) / track (wheels slide in turns)
  min_spin_wheel_mps: 0.05 # turning on the spot needs at least this wheel speed (stiction)
  speed_variation: 0.0     # real speed = speed_scale * (1 + this * sin(2 pi t / speed_period_s))
  speed_period_s: 40.0
  failsafe_timeout_s: null # null = the car keeps the last command if commands stop
  encoder_noise: 0.02      # /odom_wheel speed noise (relative)
lidar:                     # RPLIDAR A1-like
  rate_hz: 7.0
  samples: 720
  range_min_m: 0.15
  range_max_m: 12.0
  noise_std_m: 0.01
  dropout: 0.02            # share of beams returning nothing
lite:
  physics_hz: 100.0
  realtime_factor: 1.0     # >1 runs the lite backend faster than real time
