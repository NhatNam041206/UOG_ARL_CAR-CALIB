name: nav2 sim sweep

# Pass rate of each Nav2 parameter variant over repeated missions.
# Plan + variants: ros/car_nav_sim/sweeps/ (plan.yaml lists what to run).
# Every (variant, mission, odometry) is one job that runs the mission
# `repeats` times with different LiDAR noise seeds; the summary job prints
# one table. The sim never talks to the car (no MQTT, own container).

# Started by hand only (Actions -> nav2 sim sweep -> Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      repeats: ${{ steps.m.outputs.repeats }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, yaml
          p = yaml.safe_load(open("ros/car_nav_sim/sweeps/plan.yaml"))
          inc = [{"variant": v, "stress": st, "mission": m, "odom": o}
                 for v in p["variants"] for st in p.get("stress", ["nominal"])
                 for m in p["missions"] for o in p["odom"]]
          print("matrix=" + json.dumps({"include": inc}))
          print(f"repeats={int(p.get('repeats', 5))}")
          PY

  run:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: ${{ matrix.variant }} ${{ matrix.stress }} ${{ matrix.mission }} ${{ matrix.odom }}
    steps:
      - uses: actions/checkout@v4
      - name: Build sim image
        run: docker build -f docker/sim/Dockerfile -t car-calib-nav-sim:latest .
      - name: Variant params
        run: |
          mkdir -p variant
          docker run --rm -v "$PWD:/repo:ro" -v "$PWD/variant:/out" car-calib-nav-sim:latest \
            python3 /repo/scripts/sim/apply_overrides.py /repo/ros/car_nav/config/nav2_params.yaml \
              /repo/ros/car_nav_sim/sweeps/${{ matrix.variant }}.yaml /out/nav2_params.yaml
          docker run --rm -v "$PWD:/repo:ro" -v "$PWD/variant:/out" car-calib-nav-sim:latest \
            python3 /repo/scripts/sim/apply_overrides.py /repo/ros/car_nav_sim/config/sim.yaml \
              /repo/ros/car_nav_sim/sweeps/stress/${{ matrix.stress }}.yaml /out/sim.yaml sim
      - name: Missions
        env:
          V: ${{ matrix.variant }}
          S: ${{ matrix.stress }}
          M: ${{ matrix.mission }}
          O: ${{ matrix.odom }}
          N: ${{ needs.plan.outputs.repeats }}
        run: |
          mkdir -p out
          for seed in $(seq 1 "$N"); do
            d="out/$V@$S-$M-$O-s$seed"; mkdir -p "$d"
            timeout 600 docker run --rm -e ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST \
              -e CAR_NAV_NAV2_PARAMS=/variant/nav2_params.yaml -e CAR_NAV_SIM_CONFIG=/variant/sim.yaml \
              -v "$PWD/variant:/variant:ro" \
              -v "$PWD/$d:/data/sim" car-calib-nav-sim:latest \
              ros2 launch car_nav_sim sim.launch.py mission:=$M odom_source:=$O seed:=$seed report_dir:=/data/sim \
              > "$d/launch.log" 2>&1 || true
            rep=$(ls "$d"/report-*.json 2>/dev/null | head -1 || true)
            if [ -n "$rep" ]; then
              python3 -c "import json,sys; r=json.load(open(sys.argv[1])); print('seed', sys.argv[2], 'PASS' if r['passed'] else 'FAIL', [g['result'][:4] + ('/COLL' if g['collision'] else '') for g in r['goals']])" "$rep" "$seed"
            else
              echo "seed $seed NO REPORT"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-${{ matrix.variant }}-${{ matrix.stress }}-${{ matrix.mission }}-${{ matrix.odom }}
          path: out/*/report-*.json
          retention-days: 14

  summary:
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sweep-*
          path: reports
      - name: Pass rates
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import collections, glob, json, os, re
          rows = collections.defaultdict(lambda: {"runs": 0, "pass": 0, "goals": 0, "goals_ok": 0,
                                                  "coll": 0, "min_clear": 9.0, "end_err": [], "rev": []})
          for f in glob.glob("reports/**/report-*.json", recursive=True):
              m = re.search(r"/([^/]+)-(loop_[a-z]+)-([a-z0-9]+)-s\d+/", f)
              if not m:
                  continue
              r = json.load(open(f))
              row = rows[(m.group(1), m.group(2), m.group(3))]
              row["runs"] += 1
              row["pass"] += bool(r["passed"])
              for g in r["goals"]:
                  row["goals"] += 1
                  row["goals_ok"] += g["result"] == "SUCCEEDED" and not g["collision"]
                  row["coll"] += bool(g["collision"])
                  row["min_clear"] = min(row["min_clear"], g["min_clearance_m"])
                  if "steer_reversals_per_m" in g and g["distance_m"] > 1.0:
                      row["rev"].append(g["steer_reversals_per_m"])
                  if g["result"] == "SUCCEEDED":
                      row["end_err"].append(g["final_xy_error_m"])
          print("| variant@car | mission | odom | missions passed | goals ok | collisions | min clearance m | median end err m | median rev/m |")
          print("|---|---|---|---|---|---|---|---|---|")
          for (v, m, o), x in sorted(rows.items()):
              e = sorted(x["end_err"]); med = e[len(e) // 2] if e else float("nan")
              rv = sorted(x["rev"]); rmed = rv[len(rv) // 2] if rv else float("nan")
              print(f"| {v} | {m} | {o} | {x['pass']}/{x['runs']} | {x['goals_ok']}/{x['goals']} | {x['coll']} "
                    f"| {x['min_clear']:.2f} | {med:.2f} | {rmed:.2f} |")
          tot = collections.defaultdict(lambda: [0, 0])
          for (v, _, _), x in rows.items():
              tot[v][0] += x["pass"]; tot[v][1] += x["runs"]
          print()
          for v, (p, n) in sorted(tot.items(), key=lambda kv: -kv[1][0] / max(kv[1][1], 1)):
              print(f"SWEEP {v}: {p}/{n} missions passed")
          PY
